name: Build ShareX (HEIC)

# Builds a portable ShareX with the libheif decoder bundled. Run it manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        options:
          - x64
          - ARM64
        default: x64

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: windows-latest

    permissions:
      contents: read

    env:
      PLATFORM: ${{ inputs.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set RUNTIME_ID
        run: |
          $arch = "${{ inputs.platform }}".ToLowerInvariant()
          echo "RUNTIME_ID=win-$arch" >> $env:GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-libheif-${{ inputs.platform }}-${{ hashFiles('Scripts/Build-LibHeif.ps1') }}

      - name: Build libheif
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .\Scripts\Build-LibHeif.ps1 -Platform "${{ inputs.platform }}" -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT

      - name: Restore NuGet packages
        run: |
          dotnet restore --runtime "${{ env.RUNTIME_ID }}" ShareX.sln
          if ("${{ inputs.platform }}" -eq "ARM64") {
            # ShareX.Setup always builds as x64, so restore win-x64 packages too
            dotnet restore --runtime "win-x64" "ShareX.Setup\ShareX.Setup.csproj"
          }

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Platform="${{ inputs.platform }}" --self-contained true /m ShareX.sln

      - name: Publish
        run: dotnet publish --no-build --configuration Release -p:Platform="${{ inputs.platform }}" --self-contained true -o "publish\ShareX" ShareX\ShareX.csproj

      - name: Check libheif is bundled
        run: |
          if (-not (Test-Path "publish\ShareX\heif.dll") -and -not (Test-Path "publish\ShareX\libheif.dll")) {
            throw "heif.dll is missing from the output."
          }
          Copy-Item Licenses\*.txt -Destination (New-Item -ItemType Directory -Force -Path "publish\ShareX\Licenses")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShareX-HEIC-portable-${{ env.RUNTIME_ID }}
          path: publish\ShareX
